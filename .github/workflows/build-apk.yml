name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm ci

      - name: Buat proyek Android
        run: npx cap add android

      - name: Terapkan ikon dan pengaturan
        run: ./scripts/patch-android.sh

      - name: Cap nomor build (untuk lonceng pembaruan)
        run: |
          sed -i "s/const BUILD = 0;/const BUILD = ${{ github.run_number }};/" www/index.html
          grep -q "const BUILD = ${{ github.run_number }};" www/index.html

      - name: Sinkronkan aplikasi web ke Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tiket-dutakasir.apk

      - name: Pastikan APK memakai tanda tangan tetap
        run: |
          WANT=$(keytool -list -keystore signing/tiket.keystore -storepass android | grep -o 'SHA-256: .*\|[0-9A-F:]\{95\}' | head -1 | grep -o '[0-9A-F:]\{95\}')
          GOT=$(keytool -printcert -jarfile tiket-dutakasir.apk | grep -o 'SHA256: [0-9A-F:]*' | head -1 | cut -c9-)
          echo "kunci tetap : $WANT"
          echo "kunci APK   : $GOT"
          test -n "$WANT" && test "$WANT" = "$GOT"

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiket-dutakasir-apk
          path: tiket-dutakasir.apk
          retention-days: 30

      - name: Terbitkan di Releases (APK terbaru)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: APK terbaru
          body: |
            build: ${{ github.run_number }}
            APK debug Tiket Duta Kasir, dibuat otomatis dari commit ${{ github.sha }}.
            Unduh `tiket-dutakasir.apk` di bawah, lalu pasang di Android (izinkan "install dari sumber ini" bila diminta).
          files: tiket-dutakasir.apk
          make_latest: true
